[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-evaluation-qa"
version = "2.6.0"
description = "Production-grade framework for evaluating AI model responses"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "Darshil"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "openai>=2.44.0,<3.0.0",
    "aiohttp>=3.11.0,<4.0.0",
    "jsonschema>=4.26.0,<5.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "matplotlib>=3.11.0,<4.0.0",
    "plotly>=6.8.0,<7.0.0",
    "click>=8.4.0,<9.0.0",
    "python-dotenv>=1.2.0,<2.0.0",
    "tiktoken>=0.13.0,<1.0.0",
    "numpy>=2.5.0,<3.0.0",
    "pandas>=3.0.0,<4.0.0",
    "scipy>=1.18.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "pytest-html>=4.2.0,<5.0.0",
    "black>=26.5.0,<27.0.0",
    "isort>=8.0.0,<9.0.0",
    "flake8>=7.3.0,<8.0.0",
    "flake8-bugbear>=25.11.0,<26.0.0",
    "mypy>=2.1.0,<3.0.0",
    "pylint>=4.0.0,<5.0.0",
    "bandit>=1.9.0,<2.0.0",
    "safety>=3.8.0,<4.0.0",
    "pre-commit>=4.6.0,<5.0.0",
    "coverage>=7.15.0,<8.0.0",
    "coverage-badge>=1.1.2,<2.0.0",
]

[project.urls]
"Bug Reports" = "https://github.com/darshil0/AI-Evaluation-QA/issues"
"Source" = "https://github.com/darshil0/AI-Evaluation-QA"

[project.scripts]
ai-eval = "main:cli"

[tool.pytest.ini_options]
addopts = "--cov=evaluation --cov=config --cov=scripts --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
branch = true
source = ["evaluation", "config", "scripts"]
omit = ["tests/*", "setup.py", "main.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true


[[tool.mypy.overrides]]
module = "tiktoken.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true

[tool.setuptools]
packages = ["evaluation", "config", "scripts", "evaluation.clients"]
