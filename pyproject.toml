[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-evaluation-qa"
version = "2.4.5"
description = "A production-grade framework for evaluating AI model responses"
readme = "README.md"
authors = [{ name = "Darshil Shah" }]
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
    "ai",
    "evaluation",
    "qa",
    "testing",
    "llm",
    "quality-assurance",
    "prompt-testing",
    "model-evaluation",
    "gpt",
    "claude",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Fixed: Unified versions across pyproject.toml, setup.py, and requirements.txt
dependencies = [
    "openai>=1.60.0,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
    "plotly>=5.24.0,<6.0.0",
    "click>=8.1.0,<9.0.0",
    "tiktoken>=0.7.0,<1.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "aiohttp>=3.10.0,<4.0.0",
    "jsonschema>=4.21.0,<5.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.13.0,<2.0.0",
    "matplotlib>=3.8.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-xdist>=3.6.0,<4.0.0",
    "pytest-html>=4.1.0,<5.0.0",
    "black>=24.10.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
    "flake8>=7.0.0,<8.0.0",
    "flake8-bugbear>=24.0.0,<25.0.0",
    "mypy>=1.9.0,<2.0.0",
    "pylint>=3.1.0,<4.0.0",
    "bandit>=1.7.0,<2.0.0",
    "safety>=3.0.0,<4.0.0",
    "pre-commit>=3.6.0,<4.0.0",
    "coverage>=7.6.0,<8.0.0",
    "coverage-badge>=1.1.2,<2.0.0",
]
pdf = ["reportlab>=3.6.0", "weasyprint>=54.0"]
ml = ["scikit-learn>=1.1.0"]

[project.urls]
"Bug Reports" = "https://github.com/darshil0/AI-Evaluation-QA/issues"
"Source" = "https://github.com/darshil0/AI-Evaluation-QA"
"Documentation" = "https://github.com/darshil0/AI-Evaluation-QA/blob/main/README.md"

[project.scripts]
ai-eval = "main:cli"

[tool.setuptools]
# Fixed: Use package discovery for evaluation, config, scripts
packages = ["evaluation", "config", "scripts"]
py-modules = ["main"]

[tool.setuptools.package-data]
evaluation = ["*.yaml", "*.yml", "*.json"]
config = ["*.yaml", "*.yml"]
scripts = ["*.yaml", "*.yml"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100
py_version = 39
skip_gitignore = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "asyncio: tests using asyncio",
]
minversion = "8.0"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_no_return = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
no_implicit_optional = true
strict_equality = true

[tool.pylint.messages_control]
disable = [
    "C0330",  # Wrong hanging indentation before block
    "C0326",  # Bad whitespace
]

[tool.bandit]
exclude_dirs = ["tests", "docs"]

[tool.coverage.run]
branch = true
source = ["evaluation", "config", "scripts"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*Protocol.*:",
]
