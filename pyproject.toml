[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-evaluation-qa"
version = "2.4.5"
description = "AI Evaluation QA Framework"
readme = "README.md"
authors = [
    { name = "QA Engineering Team" }
]
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "aiohttp>=3.10.0",
    "openai>=1.60.0",
    "anthropic>=0.45.0",
    "pandas>=2.2.0",
    "matplotlib>=3.10.0",
    "scipy>=1.14.0",
    "plotly>=5.24.0",
    "tiktoken>=0.8.0",
    "jsonschema>=4.23.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.10.0",
    "isort>=5.13.0",
    "flake8>=7.3.0",
    "mypy>=1.20.0",
    "pre-commit>=3.8.0",
    "types-PyYAML",
    "types-requests",
    "bandit",
    "safety",
]

[project.scripts]
ai-eval = "main:cli"

[tool.setuptools]
packages = ["evaluation", "config", "scripts", "evaluation.clients"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json"]

[tool.pytest.ini_options]
addopts = "--cov=evaluation --cov=config --cov=scripts --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
branch = true
source = ["evaluation", "config", "scripts"]
omit = ["tests/*", "setup.py", "main.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pandas.*", "scipy.*", "matplotlib.*", "tiktoken.*", "jsonschema.*", "yaml.*", "authlib.*", "joserfc.*", "plotly.*"]
ignore_missing_imports = true
