name: Evaluation Regression

on:
  push:
    branches: [main]
    paths:
      - "evaluation/**"
      - "config/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run sanity evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p data/prompts reports
          if [ ! -f data/prompts/sanity_check.json ]; then
            cat > data/prompts/sanity_check.json <<'EOF'
          {"prompts":[{"id":"sanity-1","prompt":"Say hello","expected":"Hello"}]}
          EOF
          fi

          if [ -n "$OPENAI_API_KEY" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
            ai-eval evaluate --prompts data/prompts/sanity_check.json
          else
            echo "API keys not found, performing import validation only."
            python -c "from evaluation.evaluation_pipeline import EvaluationPipeline; print('Pipeline import successful')"
          fi

      - name: Check for regressions
        run: |
          shopt -s nullglob
          files=(reports/run_results_*_scored.csv)

          if [ -f reports/baseline.csv ] && [ ${#files[@]} -gt 0 ]; then
            latest=""
            for f in "${files[@]}"; do
              if [ -z "$latest" ] || [ "$f" -nt "$latest" ]; then
                latest="$f"
              fi
            done
            ai-eval check-regression "$latest" --baseline reports/baseline.csv
          else
            echo "Baseline or scored results missing; skipping regression check."
          fi
